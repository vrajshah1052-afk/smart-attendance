# Render Blueprint: one Docker web service (API + React app + ArcFace models).
# Databases are external free tiers: MySQL on Aiven, MongoDB on Atlas.
# Values marked "sync: false" are asked for when the Blueprint is created.
services:
  - type: web
    name: smart-attendance
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      # ---- MySQL (Aiven): host + port from the Aiven console, password = MYSQL_APP_PASSWORD in your .env.cloud
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_APP_PASSWORD
        sync: false
      - key: MYSQL_APP_USER
        value: attendance_app
      - key: MYSQL_DATABASE
        value: attendance_db
      - key: MYSQL_SSL
        value: "true"
      - key: MYSQL_TIME_ZONE
        value: "+05:30"
      - key: MYSQL_POOL_SIZE
        value: "4"
      - key: MYSQL_CONNECT_RETRIES
        value: "10"
      # ---- MongoDB (Atlas): mongodb+srv://<user>:<password>@<cluster>/?retryWrites=true&w=majority
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: attendance_logs
      # ---- secrets generated by Render (never change EMBEDDING_ENC_KEY: stored faces depend on it)
      - key: JWT_SECRET
        generateValue: true
      - key: EMBEDDING_ENC_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@example.org
      - key: ADMIN_PASSWORD
        generateValue: true
      # ---- face engine: buffalo_s fits the 512 MB free instance
      - key: MATCH_THRESHOLD
        value: "0.45"
      - key: DUPLICATE_THRESHOLD
        value: "0.55"
      - key: EMAIL_ENABLED
        value: "false"
